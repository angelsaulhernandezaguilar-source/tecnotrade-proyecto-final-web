; Configuración de PHP para ejecutar TecnoTrade en local con iniciar.bat.
; (Con XAMPP se usa el php.ini de XAMPP y este archivo se ignora.)

extension_dir = "ext"

; Extensiones que usa la tienda
extension = pdo_mysql   ; conexión a MySQL / MariaDB
extension = fileinfo    ; validación de las imágenes que se suben
extension = mbstring    ; búsquedas con acentos y mayúsculas
extension = openssl     ; inicio de sesión de MySQL 8 (caching_sha2_password) y HTTPS
extension = curl        ; envío de correos de recuperación (opcional)

; Los errores van a la ventana del servidor, nunca a la página
display_errors = Off
log_errors = On
error_reporting = E_ALL

; La API acepta imágenes de hasta 5 MB
post_max_size = 8M
upload_max_filesize = 8M
memory_limit = 128M

date.timezone = "America/Mexico_City"
default_charset = "UTF-8"
expose_php = Off
